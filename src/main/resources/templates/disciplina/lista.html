<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header"></head>
<body>
  <div th:replace="fragments/navbar :: navbar"></div>
  <div class="container mt-4">
    <h2>Lista de Disciplinas</h2>

    <a class="btn btn-primary mb-2" href="/disciplinas/form">Nova Disciplina</a>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Ano</th>
          <th>Período</th>
          <th>Professor</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="d : ${disciplinas}">
          <td th:text="${d.nome}"></td>
          <td th:text="${d.ano}"></td>
          <td th:text="${d.periodo}"></td>
          <td th:text="${d.professor}"></td>
          <td>
            <a th:href="@{'/disciplinas/editar/' + ${d.id}}" class="btn btn-warning btn-sm">Editar</a>
            <a th:href="@{'/disciplinas/excluir/' + ${d.id}}" class="btn btn-danger btn-sm">Excluir</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
