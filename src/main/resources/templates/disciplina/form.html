<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header"></head>
<body>
  <div th:replace="fragments/navbar :: navbar"></div>
  <div class="container mt-4">
    <h2 th:text="${disciplina.id != null} ? 'Editar Disciplina' : 'Nova Disciplina'"></h2>

    <form th:action="@{/disciplinas/salvar}" th:object="${disciplina}" method="post">
      <input type="hidden" th:field="*{id}" />

      <div class="mb-3">
        <label for="nome">Nome</label>
        <input id="nome" th:field="*{nome}" class="form-control" />
      </div>

      <div class="mb-3">
        <label for="ano">Ano</label>
        <input id="ano" th:field="*{ano}" class="form-control" />
      </div>

      <div class="mb-3">
        <label for="periodo">Período</label>
        <input id="periodo" th:field="*{periodo}" class="form-control" />
      </div>

      <div class="mb-3">
        <label for="professor">Professor</label>
        <input id="professor" th:field="*{professor}" class="form-control" />
      </div>

      <button type="submit" class="btn btn-success">Salvar</button>
      <a th:href="@{/disciplinas/lista}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
  <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
