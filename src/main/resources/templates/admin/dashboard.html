<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header"></head>
<body>
  <div th:replace="fragments/navbar :: navbar"></div>

  <div class="container-fluid">
    <div class="row">
      
      <!-- Sidebar -->
      <div class="col-md-3">
        <div th:replace="fragments/sidebar :: sidebar"></div>
      </div>

      <!-- Conteúdo principal -->
      <div class="col-md-9 mt-4">
        <h2>Dashboard do Administrador</h2>
        <p>Bem-vindo, <strong th:text="${nomeUsuario}">Usuário</strong>!</p>

        <div class="row mt-4">
          <div class="col-md-4 mb-3">
            <a href="/usuarios/lista" class="btn btn-outline-primary w-100">Gerenciar Alunos</a>
          </div>
          <div class="col-md-4 mb-3">
            <a href="/professor/lista" class="btn btn-outline-primary w-100">Gerenciar Professores</a>
          </div>
          <div class="col-md-4 mb-3">
            <a href="/disciplinas/lista" class="btn btn-outline-primary w-100">Gerenciar Disciplinas</a>
          </div>
          <div class="col-md-4 mb-3">
            <a href="/turmas/lista" class="btn btn-outline-primary w-100">Gerenciar Turmas</a>
          </div>
          <div class="col-md-4 mb-3">
            <a href="/matriculas/lista" class="btn btn-outline-primary w-100">Gerenciar Matrículas</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="fragments/footer :: footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
